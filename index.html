<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шахматы с другом</title>
  <meta name="description" content="Шахматы по сети с другом и подсказками Stockfish">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="logo">♞ Шахматы с другом</div>
    <button id="btnSettings" class="icon-btn" title="Настройки" aria-label="Настройки">⚙</button>
  </header>

  <main>
    <!-- Лобби -->
    <section id="lobby" class="screen">
      <div class="card lobby-card">
        <h1>Сыграть с другом</h1>
        <label class="field">Ваше имя
          <input id="nameInput" maxlength="20" placeholder="Игрок" autocomplete="nickname">
        </label>

        <div class="lobby-block hidden" id="resumeBlock">
          <h2>Незаконченная игра</h2>
          <p class="muted small" id="resumeInfo"></p>
          <button id="btnResume" class="btn primary">Продолжить</button>
        </div>

        <div class="lobby-block">
          <h2>Создать игру</h2>
          <div class="seg" id="colorPick">
            <button data-c="w" class="active">Белые</button>
            <button data-c="r">Случайно</button>
            <button data-c="b">Чёрные</button>
          </div>
          <button id="btnHost" class="btn primary">Создать и получить ссылку</button>
        </div>

        <div class="lobby-block">
          <h2>Присоединиться</h2>
          <div class="row">
            <input id="joinInput" placeholder="Ссылка или код от друга">
            <button id="btnJoin" class="btn">Войти</button>
          </div>
        </div>

        <div class="lobby-block">
          <button id="btnLocal" class="btn ghost">Играть на одном устройстве</button>
        </div>
      </div>
    </section>

    <!-- Ожидание -->
    <section id="waiting" class="screen hidden">
      <div class="card lobby-card">
        <h1 id="waitTitle">Игра создана</h1>
        <div id="shareBlock" class="hidden">
          <p>Ссылка для друга:</p>
          <div class="row">
            <input id="shareLink" readonly>
            <button id="btnCopy" class="btn primary">Копировать</button>
          </div>
        </div>
        <p class="wait-status"><span class="spinner"></span><span id="waitStatus"></span></p>
        <button id="btnCancelWait" class="btn ghost">Отмена</button>
      </div>
    </section>

    <!-- Партия -->
    <section id="game" class="screen hidden">
      <div class="board-area">
        <div class="player-strip" id="stripTop"><span class="pdot"></span><span class="pname"></span><span class="pcaps"></span></div>
        <div class="board-wrap">
          <div id="evalBar" class="eval-bar"><div class="eval-fill"></div><span class="eval-text"></span></div>
          <div id="board"></div>
        </div>
        <div class="player-strip" id="stripBottom"><span class="pdot"></span><span class="pname"></span><span class="pcaps"></span></div>
      </div>

      <aside class="side">
        <div class="card">
          <div id="statusText" class="status"></div>
          <div id="connText" class="conn"></div>
          <div id="offerBar" class="offer"></div>
        </div>
        <div class="card feedback" id="feedback"></div>
        <div class="card moves-card">
          <div class="moves" id="moveList"></div>
          <div class="nav">
            <button id="navFirst" class="btn sm" title="В начало">⏮</button>
            <button id="navPrev" class="btn sm" title="Назад (←)">◀</button>
            <button id="navNext" class="btn sm" title="Вперёд (→)">▶</button>
            <button id="navLast" class="btn sm" title="К текущей позиции">⏭</button>
          </div>
          <div id="accuracy" class="small muted"></div>
        </div>
        <div class="card actions">
          <button id="btnFlip" class="btn sm">⇅ Перевернуть</button>
          <button id="btnUndo" class="btn sm">↶ Отменить ход</button>
          <button id="btnNewLocal" class="btn sm">Новая партия</button>
          <button id="btnDraw" class="btn sm">½ Ничья</button>
          <button id="btnResign" class="btn sm danger">⚑ Сдаться</button>
          <button id="btnRematch" class="btn sm primary">Реванш</button>
          <button id="btnCopyLink" class="btn sm">🔗 Ссылка</button>
          <button id="btnLeave" class="btn sm ghost">Выйти</button>
        </div>
        <div class="card chat" id="chatCard">
          <div id="chatLog" class="chat-log"></div>
          <form id="chatForm" class="row">
            <input id="chatInput" maxlength="300" placeholder="Сообщение…" autocomplete="off">
            <button class="btn sm">➤</button>
          </form>
        </div>
      </aside>
    </section>
  </main>

  <dialog id="settingsDlg">
    <h2>Настройки</h2>
    <label class="check"><input type="checkbox" id="set-evalBar"> Шкала оценки (eval bar)</label>
    <label class="check"><input type="checkbox" id="set-classify"> Оценка ходов: лучший / ошибка / зевок</label>
    <label class="check"><input type="checkbox" id="set-bestMove"> Показывать лучший ход (стрелка)</label>
    <label class="check"><input type="checkbox" id="set-coords"> Координаты на доске</label>
    <label class="check"><input type="checkbox" id="set-sound"> Звук ходов</label>
    <label class="field">Глубина анализа Stockfish: <b id="depthVal"></b>
      <input type="range" id="set-depth" min="8" max="20" step="1">
    </label>
    <p class="small muted">Подсказки видны только на вашем устройстве. Чем больше глубина — тем точнее, но медленнее.</p>
    <div class="dlg-actions"><button id="btnCloseSettings" class="btn primary">Готово</button></div>
  </dialog>

  <div id="toast" class="toast"></div>
</body>
</html>
